<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Inicorrag</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:#f7f0ff;
color:#111;
}


/* =========================
TOPO
========================= */

header{

height:85px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 6%;

background:white;

border-bottom:5px solid black;

position:sticky;

top:0;

z-index:1000;

}


.logo{

font-size:29px;

font-weight:900;

letter-spacing:-2px;

transform:rotate(-2deg);

}


nav{

display:flex;

gap:30px;

}


nav a{

color:#111;

text-decoration:none;

font-weight:900;

font-size:15px;

padding:8px 12px;

transition:.15s;

}


nav a:hover{

background:#d7a8ff;

border:3px solid black;

transform:rotate(-2deg);

}



/* =========================
HERO
========================= */

.hero{

min-height:680px;

display:flex;

align-items:center;

justify-content:center;

position:relative;

overflow:hidden;

padding:70px 7%;

background:

radial-gradient(
circle,
rgba(255,255,255,.15) 2px,
transparent 2px
),

linear-gradient(
135deg,
#240046,
#5a189a,
#9d4edd,
#c77dff
);

background-size:
25px 25px,
100% 100%;

border-bottom:6px solid black;

}


.hero-container{

width:100%;

max-width:1250px;

display:flex;

align-items:center;

justify-content:space-between;

gap:40px;

}



/* =========================
TEXTO
========================= */

.hero-texto{

width:55%;

position:relative;

z-index:3;

}


.hero-texto h1{

font-size:clamp(70px,10vw,145px);

line-height:.8;

letter-spacing:-8px;

color:white;

text-shadow:
6px 6px 0 black;

transform:rotate(-2deg);

margin-bottom:35px;

}


.hero-texto p{

max-width:570px;

font-size:clamp(22px,2vw,31px);

line-height:1.05;

font-weight:900;

background:white;

padding:22px 28px;

border:5px solid black;

box-shadow:
9px 9px 0 black;

transform:rotate(1deg);

}



/* =========================
BOTÃO
========================= */

.botao{

display:inline-block;

margin-top:38px;

background:#ffe247;

color:black;

text-decoration:none;

font-size:18px;

font-weight:900;

padding:18px 30px;

border:5px solid black;

box-shadow:
7px 7px 0 black;

transform:rotate(-2deg);

transition:.15s;

}


.botao:hover{

transform:
rotate(1deg)
translate(4px,4px);

box-shadow:
3px 3px 0 black;

}



/* =========================
PERSONAGEM
========================= */

.personagem-area{

width:45%;

min-height:500px;

display:flex;

align-items:center;

justify-content:center;

position:relative;

}


.personagem{

width:100%;

max-width:470px;

max-height:560px;

object-fit:contain;

filter:
drop-shadow(8px 8px 0 black);

animation:
flutuar 3s ease-in-out infinite;

}


@keyframes flutuar{

0%,100%{

transform:
rotate(2deg)
translateY(0);

}

50%{

transform:
rotate(-1deg)
translateY(-15px);

}

}



/* =========================
ESTRELAS
========================= */

.estrela{

position:absolute;

color:#ffe247;

font-size:70px;

font-weight:900;

-webkit-text-stroke:
3px black;

}


.estrela1{

top:50px;

right:7%;

transform:rotate(20deg);

}


.estrela2{

bottom:40px;

left:48%;

font-size:45px;

transform:rotate(-15deg);

}



/* =========================
CONTEÚDO
========================= */

.conteudos{

padding:100px 7%;

max-width:1400px;

margin:auto;

}


.titulo{

display:inline-block;

font-size:clamp(40px,5vw,70px);

font-weight:900;

margin-bottom:60px;

transform:rotate(-2deg);

border-bottom:
8px solid #7c2bd4;

}


.cards{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:35px;

}



/* =========================
CARDS
========================= */

.card{

background:white;

border:5px solid black;

box-shadow:
10px 10px 0 black;

padding:15px;

transition:.2s;

display:flex;

flex-direction:column;

overflow:hidden;

}


.card:nth-child(1){

transform:rotate(-2deg);

}


.card:nth-child(2){

transform:rotate(1deg);

}


.card:nth-child(3){

transform:rotate(-1deg);

}


.card:hover{

transform:
rotate(0deg)
translateY(-10px);

}



/* =========================
MÍDIA DOS CARDS
========================= */

.midia{

width:100%;

height:230px;

border:4px solid black;

overflow:hidden;

background:#351050;

margin-bottom:20px;

}


.midia img{

width:100%;

height:100%;

object-fit:cover;

display:block;

}


.midia iframe{

width:100%;

height:100%;

border:0;

display:block;

}



/* =========================
TEXTOS DOS CARDS
========================= */

.categoria{

font-size:13px;

font-weight:900;

text-transform:uppercase;

color:#7424c9;

margin-bottom:8px;

}


.card h2{

font-size:25px;

line-height:1;

margin-bottom:15px;

}



/* =========================
RODAPÉ
========================= */

footer{

min-height:130px;

display:flex;

align-items:center;

justify-content:space-between;

padding:30px 7%;

background:#111;

color:white;

font-weight:900;

}


.link-secreto{

color:inherit;

text-decoration:none;

}



/* =========================
CELULAR
========================= */

@media(max-width:800px){

header{

height:70px;

}


nav{

display:none;

}


.hero{

padding:
70px 25px;

}


.hero-container{

flex-direction:column;

}


.hero-texto{

width:100%;

}


.hero-texto h1{

letter-spacing:-4px;

}


.personagem-area{

width:100%;

min-height:400px;

}


.personagem{

max-height:420px;

}


.cards{

grid-template-columns:1fr;

}


.estrela2{

display:none;

}

}

</style>

</head>



<body>

TOPO
========================= -->

<header>

<div class="logo">

INICORRAG

</p>

href="#conteudos"
class="botao">

VER COISAS ↓

</div>



<!-- PERSONAGEM -->

<div class="personagem-area">


<img

class="personagem"

src="https://drive.google.com/thumbnail?id=1lNRPenH6uYpxWj9kcZsB_J9fdbH6ZBvq&sz=w1000"

alt="Personagem Inicorrag"

>


</div>


</div>

</section>



<!-- =========================
CONTEÚDOS
========================= -->

<section
class="conteudos"
id="conteudos">

<div class="cards">



<!-- =========================

========================= -->

<div class="midia">


<iframe

src="https://www.youtube.com/embed/Oiu5q2NTPS0"

accelerometer;
autoplay;
clipboard-write;
encrypted-media;
gyroscope;

web-share"

allowfullscreen>

</iframe>


</div>


<div class="categoria">

</div>

<!-- =========================

========================= -->

<article class="card">


<div class="midia">


<img

src="https://drive.google.com/thumbnail?id=1YDo2fDQ7YB002ehVl6GbxjU7dNhss-dN&sz=w1000"

<!-- =========================
PROJETO
========================= -->

<article class="card">


<div class="midia">

src="https://drive.google.com/file/d/1MboUJnwQ23DMbO9r7BbDXw6TNuV0xJLU/preview"

allowfullscreen>

</div>


<div class="categoria">

</div>

</section>



<!-- =========================
RODAPÉ
========================= -->

<footer>

</div>

</footer>


</body>

</html>

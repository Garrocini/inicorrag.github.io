<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicorrag</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0c0c0c;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* TOPO */

        header {
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #252525;

            position: sticky;
            top: 0;

            background: #0c0c0c;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 35px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 15px;

            transition: 0.2s;
        }

        nav a:hover {
            color: white;
        }

        /* ÁREA PRINCIPAL */

        .hero {
            min-height: 650px;

            display: flex;
            align-items: center;

            padding: 0 7%;

            border-bottom: 1px solid #222;
        }

        .hero-texto {
            max-width: 700px;
        }

        .hero h1 {
            font-size: clamp(60px, 9vw, 140px);
            line-height: 0.9;

            margin-bottom: 30px;
        }

        .hero p {
            color: #999;

            font-size: 20px;
            line-height: 1.5;

            max-width: 550px;
        }

        .hero button {
            margin-top: 35px;

            border: none;
            padding: 17px 30px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            border-radius: 6px;
        }

        /* CONTEÚDOS */

        .conteudo {
            padding: 100px 7%;
        }

        .titulo-secao {
            font-size: 35px;
            margin-bottom: 50px;
        }

        .cards {
            display: grid;

            grid-template-columns:
            repeat(auto-fit, minmax(250px, 1fr));

            gap: 25px;
        }

        .card {
            background: #151515;

            min-height: 320px;

            border-radius: 10px;

            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-8px);
            background: #1c1c1c;
        }

        .card span {
            font-size: 12px;
            color: #777;

            text-transform: uppercase;
            letter-spacing: 2px;

            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 25px;
        }

        /* RODAPÉ */

        footer {
            border-top: 1px solid #222;

            padding: 50px 7%;

            color: #666;

            display: flex;
            justify-content: space-between;
        }

        /* CELULAR */

        @media(max-width: 700px) {

            nav {
                display: none;
            }

            .hero {
                min-height: 550px;
            }

            footer {
                flex-direction: column;
                gap: 20px;
            }

        }

    </style>

</head>

<body>


<header>

    <div class="logo">
        INICORRAG
    </div>

    <nav>
        <a href="#">Início</a>
        <a href="#">Conteúdos</a>
        <a href="#">Projetos</a>
        <a href="#">Sobre</a>
    </nav>

</header>


<section class="hero">

    <div class="hero-texto">

        <h1>
            INICORRAG
        </h1>

        <p>
            Um lugar para coisas que provavelmente
            não precisavam existir.
        </p>

        <button>
            VER CONTEÚDO
        </button>

    </div>

</section>


<section class="conteudo">

    <h2 class="titulo-secao">
        Destaques
    </h2>

    <div class="cards">

        <div class="card">

            <span>
                Projeto
            </span>

            <h2>
                Alguma coisa interessante
            </h2>

        </div>


        <div class="card">

            <span>
                Vídeo
            </span>

            <h2>
                Outra coisa completamente diferente
            </h2>

        </div>


        <div class="card">

            <span>
                Especial
            </span>

            <h2>
                Provavelmente uma péssima ideia
            </h2>

        </div>

    </div>

</section>


<footer>

    <div>
        INICORRAG
    </div>

    <div>
        © 2026
    </div>

</footer>


</body>
</html>

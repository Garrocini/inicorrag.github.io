<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARABÉNS!</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(
        125deg,
        #ff3cac,
        #784ba0,
        #2b86c5,
        #00d4ff,
        #ffe347,
        #ff6b35
    );
    background-size: 500% 500%;
    animation: fundoFesta 9s ease infinite;
}

@keyframes fundoFesta {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

.pagina {
    width: 100%;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    z-index: 5;
}

.titulo {
    font-size: clamp(65px, 12vw, 180px);
    font-weight: 1000;
    line-height: .75;
    letter-spacing: -7px;
    color: white;
    transform: rotate(-3deg);
    -webkit-text-stroke: 6px #111;
    text-shadow: 10px 10px 0 #111;
    animation: tituloEntrada .7s cubic-bezier(.2,1.5,.5,1) forwards;
}

@keyframes tituloEntrada {
    from {
        opacity: 0;
        transform: scale(.2) rotate(-20deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(-3deg);
    }
}

.subtitulo {
    margin-top: 25px;
    background: #ffe647;
    border: 6px solid #111;
    box-shadow: 10px 10px 0 #111;
    padding: 15px 35px;
    font-size: clamp(26px, 4vw, 55px);
    font-weight: 1000;
    transform: rotate(2deg);
    animation: aparecerSubtitulo .5s ease .6s backwards;
}

@keyframes aparecerSubtitulo {
    from {
        opacity: 0;
        transform: scale(0) rotate(15deg);
    }
}

.imagem-final {
    margin-top: 35px;
    width: min(580px, 75vw);
    max-height: 50vh;
    object-fit: contain;
    position: relative;
    z-index: 10;
    filter: drop-shadow(12px 12px 0 #111);
    animation:
        personagemEntrada .8s cubic-bezier(.2,1.4,.3,1) .9s backwards,
        personagemFesta 1.2s ease-in-out 1.7s infinite alternate;
}

@keyframes personagemEntrada {
    from {
        opacity: 0;
        transform: translateY(600px) rotate(20deg) scale(.2);
    }
}

@keyframes personagemFesta {
    from {
        transform: translateY(0) rotate(-2deg);
    }

    to {
        transform: translateY(-12px) rotate(2deg);
    }
}

.estrela {
    position: absolute;
    font-size: clamp(45px, 7vw, 100px);
    color: #ffe647;
    -webkit-text-stroke: 4px #111;
    z-index: 4;
    animation: girarEstrela 3s linear infinite;
}

.e1 {
    left: 5%;
    top: 8%;
}

.e2 {
    right: 6%;
    top: 12%;
    animation-direction: reverse;
}

.e3 {
    left: 12%;
    bottom: 8%;
}

.e4 {
    right: 12%;
    bottom: 10%;
    animation-direction: reverse;
}

@keyframes girarEstrela {
    to {
        transform: rotate(360deg);
    }
}

.confete {
    position: fixed;
    width: 12px;
    height: 25px;
    z-index: 20;
    pointer-events: none;
    top: 50%;
}

.confete.esquerda {
    left: -30px;
    animation: soprarEsquerda var(--tempo) cubic-bezier(.15,.7,.4,1) forwards;
}

.confete.direita {
    right: -30px;
    animation: soprarDireita var(--tempo) cubic-bezier(.15,.7,.4,1) forwards;
}

@keyframes soprarEsquerda {
    0% {
        transform: translate(0,0) rotate(0deg);
        opacity: 1;
    }

    35% {
        transform: translate(35vw,var(--altura1)) rotate(360deg);
    }

    100% {
        transform: translate(115vw,var(--altura2)) rotate(1000deg);
        opacity: .1;
    }
}

@keyframes soprarDireita {
    0% {
        transform: translate(0,0) rotate(0deg);
        opacity: 1;
    }

    35% {
        transform: translate(-35vw,var(--altura1)) rotate(-360deg);
    }

    100% {
        transform: translate(-115vw,var(--altura2)) rotate(-1000deg);
        opacity: .1;
    }
}

.duvida {
    position: fixed;
    right: 18px;
    bottom: 15px;
    z-index: 100;
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.38);
    opacity: 0;
    user-select: none;
    animation: revelarDuvida 2s ease 5s forwards;
}

@keyframes revelarDuvida {
    from {
        opacity: 0;
    }

    to {
        opacity: .6;
    }
}

.flash {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    animation: flash .5s ease;
}

@keyframes flash {
    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

@media(max-width:600px) {

    .titulo {
        letter-spacing: -3px;
        -webkit-text-stroke: 3px #111;
        text-shadow: 6px 6px 0 #111;
    }

    .subtitulo {
        border-width: 4px;
        box-shadow: 6px 6px 0 #111;
    }

    .imagem-final {
        width: 85vw;
    }
}

</style>
</head>

<body>

<div class="flash"></div>

<div class="pagina">

    <div class="estrela e1">★</div>
    <div class="estrela e2">★</div>
    <div class="estrela e3">★</div>
    <div class="estrela e4">★</div>

    <h1 class="titulo">
        PARABÉNS!
    </h1>

    <div class="subtitulo">
        VOCÊ PERDEU SEU TEMPO.
    </div>

    <img
        class="imagem-final"
        src="https://drive.google.com/thumbnail?id=17cgqycTuEpY58q_le-aMH0DcWwiC0vzL&sz=w1600"
        alt="Parabéns"
    >

</div>

<div class="duvida">
    ou será que não?
</div>

<script>

const cores = [
    "#ffea00",
    "#ff006e",
    "#00f5d4",
    "#ffffff",
    "#9b5de5",
    "#fb5607",
    "#00bbf9"
];

function criarConfete(lado) {

    const confete = document.createElement("div");

    confete.classList.add("confete", lado);

    confete.style.background =
        cores[Math.floor(Math.random() * cores.length)];

    const largura =
        Math.random() * 10 + 7;

    const altura =
        Math.random() * 18 + 10;

    confete.style.width =
        largura + "px";

    confete.style.height =
        altura + "px";

    confete.style.top =
        (Math.random() * 80 + 10) + "%";

    confete.style.setProperty(
        "--altura1",
        (Math.random() * 300 - 150) + "px"
    );

    confete.style.setProperty(
        "--altura2",
        (Math.random() * 500 - 250) + "px"
    );

    confete.style.setProperty(
        "--tempo",
        (Math.random() * 2 + 2.5) + "s"
    );

    if(Math.random() > .7) {
        confete.style.borderRadius = "50%";
    }

    document.body.appendChild(confete);

    setTimeout(
        () => confete.remove(),
        5000
    );
}

for(let i = 0; i < 100; i++) {

    setTimeout(
        () => {
            criarConfete(
                i % 2 === 0
                ? "esquerda"
                : "direita"
            );
        },
        i * 15
    );

}

setInterval(
    () => {

        for(let i = 0; i < 8; i++) {

            criarConfete(
                Math.random() > .5
                ? "esquerda"
                : "direita"
            );

        }

    },
    650
);

</script>

</body>
</html>

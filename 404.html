<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle,
            rgba(157,78,221,.15) 1px,
            transparent 1px
        ),
        #050008;

    background-size: 20px 20px;

    color: white;

    font-family:
        "Courier New",
        monospace;

}

.container {

    text-align: center;

    padding: 40px;

    max-width: 900px;

}


/* 404 */

.numero {

    font-size: clamp(120px, 25vw, 300px);

    font-weight: 900;

    line-height: .8;

    color: #9d4edd;

    text-shadow:

        5px 5px 0 #3c096c,
        10px 10px 0 #000;

    animation:
        falha 3s infinite;

}


/* TEXTO */

h1 {

    margin-top: 40px;

    font-size:
        clamp(25px, 4vw, 50px);

    letter-spacing: 3px;

}


p {

    margin-top: 25px;

    color: #aaa;

    font-size: 18px;

    line-height: 1.6;

}


.pista {

    margin-top: 70px;

    font-size: 14px;

    color: #572b72;

    letter-spacing: 5px;

}


/* GLITCH */

@keyframes falha {

    0%,
    92%,
    100% {

        transform:
            translate(0);

    }

    94% {

        transform:
            translate(-5px, 2px);

    }

    96% {

        transform:
            translate(5px, -3px);

    }

    98% {

        transform:
            translate(-2px, 4px);

    }

}

</style>

</head>


<body>


<div class="container">

    <div class="numero">
        404
    </div>

    <h1>
        VOCÊ É MUITO CURIOSO.
    </h1>

    <p>
        Não havia nada para encontrar aqui.
        <br><br>
        Mas já que você chegou tão longe...
        <br>
        procure onde ninguém lê.
    </p>

    <div class="pista">
        64
    </div>

</div>


<!--
    você realmente veio procurar aqui?

    Q0lHQVJSTw==

-->


</body>

</html>
